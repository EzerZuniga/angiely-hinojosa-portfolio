<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2639;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="500" r="200" fill="#3498db" opacity="0.1"/>
  <circle cx="1050" cy="130" r="180" fill="#10b981" opacity="0.1"/>

  <!-- Avatar circle -->
  <circle cx="300" cy="315" r="120" fill="url(#accentGradient)"/>
  <text x="300" y="340" font-family="system-ui, sans-serif" font-size="72" font-weight="900" fill="white" text-anchor="middle">AH</text>

  <!-- Text content -->
  <text x="500" y="250" font-family="system-ui, sans-serif" font-size="48" font-weight="700" fill="white">
    Angiely Hinojosa
  </text>
  <text x="500" y="320" font-family="system-ui, sans-serif" font-size="28" fill="#94a3b8">
    Estudiante de Educación Física
  </text>
  <text x="500" y="370" font-family="system-ui, sans-serif" font-size="24" fill="#64748b">
    UNSAAC · Cusco, Perú
  </text>

  <!-- Accent line -->
  <rect x="500" y="400" width="200" height="4" rx="2" fill="url(#accentGradient)"/>

  <!-- Keywords -->
  <text x="500" y="460" font-family="system-ui, sans-serif" font-size="18" fill="#cbd5e1">
    Bienestar integral · Pedagogía deportiva · Formación activa
  </text>

  <!-- URL -->
  <text x="500" y="540" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#3498db">
    angiely-hinojosa.vercel.app
  </text>
</svg>
